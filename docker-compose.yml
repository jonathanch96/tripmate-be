services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tripmate
      POSTGRES_PASSWORD: tripmate
      POSTGRES_DB: tripmate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmate -d tripmate"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - tripmate-postgres:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: cosmtrek/air:latest
    working_dir: /app
    command: ["-c", ".air.toml"]
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  redpanda:
    image: redpandadata/redpanda:v24.3.18
    profiles: ["events"]
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M", "--reserve-memory", "0M", "--node-id", "0", "--check=false"]
    ports:
      - "9092:9092"

volumes:
  tripmate-postgres:

