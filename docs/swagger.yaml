basePath: /api/v1
definitions:
  authrequest.Google:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  authrequest.Login:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - email
    - password
    type: object
  authrequest.Refresh:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  authrequest.Register:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 120
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  authresponse.Session:
    properties:
      access_token:
        type: string
      access_token_expires_at:
        type: string
      pending_invitations:
        items:
          $ref: '#/definitions/invitationresponse.Invitation'
        type: array
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
      user:
        $ref: '#/definitions/userresponse.User'
    type: object
  balanceresponse.AppliedRate:
    properties:
      from:
        type: string
      is_final:
        type: boolean
      rate:
        type: string
      to:
        type: string
    type: object
  balanceresponse.FinalPlan:
    properties:
      base_currency:
        type: string
      transfers:
        items:
          $ref: '#/definitions/balanceresponse.Transfer'
        type: array
    type: object
  balanceresponse.Ledger:
    properties:
      against_user_id:
        type: string
      base_currency:
        type: string
      entries:
        items:
          $ref: '#/definitions/balanceresponse.LedgerEntry'
        type: array
      member_user_id:
        type: string
      net_balance:
        type: string
    type: object
  balanceresponse.LedgerEntry:
    properties:
      category_id:
        type: string
      counterparty_user_id:
        type: string
      date:
        type: string
      delta:
        type: string
      description:
        type: string
      expense_id:
        type: string
      kind:
        type: string
      paid:
        description: Paid/Share are only present for expense rows in the unfiltered
          ("against everyone") view.
        type: string
      running_balance:
        type: string
      settlement_id:
        type: string
      share:
        type: string
    type: object
  balanceresponse.ParticipantBalance:
    properties:
      net_balance:
        type: string
      total_owed:
        type: string
      total_paid:
        type: string
      user:
        $ref: '#/definitions/balanceresponse.User'
      user_id:
        type: string
    type: object
  balanceresponse.Result:
    properties:
      balances:
        items:
          $ref: '#/definitions/balanceresponse.ParticipantBalance'
        type: array
      base_currency:
        type: string
      debts:
        items:
          $ref: '#/definitions/balanceresponse.Transfer'
        type: array
      rates_used:
        items:
          $ref: '#/definitions/balanceresponse.AppliedRate'
        type: array
      summary:
        $ref: '#/definitions/balanceresponse.Summary'
    type: object
  balanceresponse.Summary:
    properties:
      expense_count:
        type: integer
      pending_expense_count:
        type: integer
      pending_settlement_count:
        type: integer
      settlement_count:
        type: integer
      total_expenses:
        type: string
      total_settled:
        type: string
      unsettled_total:
        type: string
    type: object
  balanceresponse.Transfer:
    properties:
      amount:
        type: string
      bank_account_holder:
        type: string
      bank_account_number:
        type: string
      bank_name:
        description: |-
          Bank details are present only for viewers allowed to see them — the payer of this transfer
          or the planner. They are nil for everyone else.
        type: string
      currency:
        type: string
      from_user_id:
        type: string
      to_user_id:
        type: string
    type: object
  balanceresponse.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      has_account:
        type: boolean
      has_logged_in:
        type: boolean
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  expensecategoryrequest.Create:
    properties:
      name:
        maxLength: 50
        type: string
    required:
    - name
    type: object
  expensecategoryresponse.ExpenseCategory:
    properties:
      id:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      trip_id:
        type: string
    type: object
  expenserequest.Create:
    properties:
      amount:
        type: string
      category_id:
        type: string
      charged_amount:
        description: |-
          ChargedAmount and ChargedCurrency are an optional record of what the payer's card or account
          actually showed. ChargedAmount is only read when ChargedCurrency is also set.
        type: string
      charged_currency:
        type: string
      currency:
        type: string
      description:
        maxLength: 255
        type: string
      expense_date:
        type: string
      note:
        type: string
      participants:
        items:
          type: string
        type: array
      payers:
        items:
          $ref: '#/definitions/expenserequest.Payer'
        minItems: 1
        type: array
      split_type:
        enum:
        - equal
        - manual
        - item
        - percent
        - shares
        type: string
      splits:
        items:
          $ref: '#/definitions/expenserequest.Split'
        type: array
    required:
    - amount
    - currency
    - description
    - expense_date
    - payers
    - split_type
    type: object
  expenserequest.Payer:
    properties:
      amount:
        type: string
      user_id:
        type: string
    required:
    - amount
    - user_id
    type: object
  expenserequest.Reject:
    properties:
      reason:
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  expenserequest.Split:
    properties:
      amount:
        type: string
      user_id:
        type: string
      weight:
        type: string
    required:
    - amount
    - user_id
    type: object
  expenserequest.Update:
    properties:
      amount:
        type: string
      category_id:
        type: string
      charged_amount:
        description: |-
          ChargedAmount and ChargedCurrency follow the same convention as CategoryID: omitted means
          "leave unchanged", a non-empty ChargedCurrency sets both fields, and an explicit empty-string
          ChargedCurrency clears both back to unset.
        type: string
      charged_currency:
        type: string
      currency:
        type: string
      description:
        type: string
      expense_date:
        type: string
      note:
        type: string
      participants:
        items:
          type: string
        type: array
      payers:
        items:
          $ref: '#/definitions/expenserequest.Payer'
        type: array
      split_type:
        type: string
      splits:
        items:
          $ref: '#/definitions/expenserequest.Split'
        type: array
      version:
        minimum: 1
        type: integer
    required:
    - version
    type: object
  expenseresponse.Expense:
    properties:
      amount:
        type: string
      approved_at:
        type: string
      approved_by:
        $ref: '#/definitions/expenseresponse.User'
      can_approve:
        type: boolean
      can_delete:
        type: boolean
      can_edit:
        type: boolean
      can_reject:
        type: boolean
      category_id:
        type: string
      charged_amount:
        type: string
      charged_currency:
        type: string
      created_at:
        type: string
      created_by:
        $ref: '#/definitions/expenseresponse.User'
      currency:
        type: string
      description:
        type: string
      expense_date:
        type: string
      id:
        type: string
      note:
        type: string
      payers:
        items:
          $ref: '#/definitions/expenseresponse.Payer'
        type: array
      rejected_reason:
        type: string
      source:
        type: string
      split_type:
        type: string
      splits:
        items:
          $ref: '#/definitions/expenseresponse.Split'
        type: array
      status:
        type: string
      trip_id:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  expenseresponse.Payer:
    properties:
      amount:
        type: string
      user:
        $ref: '#/definitions/expenseresponse.User'
      user_id:
        type: string
    type: object
  expenseresponse.Split:
    properties:
      amount:
        type: string
      user:
        $ref: '#/definitions/expenseresponse.User'
      user_id:
        type: string
      weight:
        type: string
    type: object
  expenseresponse.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      has_account:
        type: boolean
      has_logged_in:
        type: boolean
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  fxrequest.SetRate:
    properties:
      from:
        type: string
      rate:
        type: string
      to:
        type: string
    required:
    - from
    - rate
    - to
    type: object
  fxresponse.Rate:
    properties:
      from:
        type: string
      id:
        type: string
      is_final:
        description: IsFinal marks a rate locked at finalization; locked rates survive
          an unfinalize.
        type: boolean
      rate:
        type: string
      source:
        type: string
      to:
        type: string
      trip_id:
        type: string
    type: object
  invitationrequest.Create:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  invitationresponse.Invitation:
    properties:
      email:
        type: string
      expires_at:
        type: string
      has_logged_in:
        type: boolean
      id:
        type: string
      status:
        type: string
      token:
        type: string
      trip_id:
        type: string
    type: object
  invitationresponse.InviteResult:
    properties:
      invitation:
        $ref: '#/definitions/invitationresponse.Invitation'
      invite_link:
        type: string
      participant:
        $ref: '#/definitions/participantresponse.Participant'
      status:
        type: string
    type: object
  participantrequest.Add:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  participantrequest.BankInfo:
    properties:
      account_holder:
        maxLength: 160
        type: string
      account_number:
        maxLength: 120
        type: string
      bank_name:
        maxLength: 120
        type: string
    required:
    - account_holder
    - account_number
    - bank_name
    type: object
  participantrequest.Update:
    properties:
      bank_info:
        $ref: '#/definitions/participantrequest.BankInfo'
      display_name:
        maxLength: 120
        type: string
      role:
        enum:
        - planner
        - participant
        type: string
    type: object
  participantresponse.BankInfo:
    properties:
      account_holder:
        type: string
      account_number:
        type: string
      bank_name:
        type: string
    type: object
  participantresponse.Participant:
    properties:
      bank_info:
        $ref: '#/definitions/participantresponse.BankInfo'
      display_name:
        type: string
      id:
        type: string
      joined_at:
        type: string
      role:
        type: string
      trip_id:
        type: string
      user:
        $ref: '#/definitions/participantresponse.User'
      user_id:
        type: string
    type: object
  participantresponse.User:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      has_account:
        type: boolean
      has_logged_in:
        type: boolean
      id:
        type: string
      name:
        type: string
    type: object
  receipt.assignmentRequest:
    properties:
      item_id:
        type: string
      user_ids:
        items:
          type: string
        type: array
    type: object
  receipt.convertRequest:
    properties:
      description:
        type: string
      expense_date:
        type: string
      payers:
        items:
          properties:
            amount:
              type: string
            user_id:
              type: string
          type: object
        type: array
    type: object
  receipt.itemRequest:
    properties:
      name:
        type: string
      quantity:
        type: string
      total_price:
        type: string
      unit_price:
        type: string
    type: object
  receipt.itemResponse:
    properties:
      assignee_ids:
        items:
          type: string
        type: array
      id:
        type: string
      name:
        type: string
      quantity:
        type: string
      receipt_id:
        type: string
      sort_order:
        type: integer
      total_price:
        type: string
      unit_price:
        type: string
    type: object
  receipt.receiptResponse:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      currency:
        type: string
      discrepancy:
        type: boolean
      expense_id:
        type: string
      failure_reason:
        type: string
      id:
        type: string
      image_url:
        type: string
      items:
        items:
          $ref: '#/definitions/receipt.itemResponse'
        type: array
      merchant:
        type: string
      provider:
        type: string
      provider_model:
        type: string
      receipt_date:
        type: string
      service_charge:
        type: string
      size_bytes:
        type: integer
      status:
        type: string
      subtotal:
        type: string
      tax:
        type: string
      total:
        type: string
      trip_id:
        type: string
      updated_at:
        type: string
      uploaded_by:
        type: string
      uploader:
        $ref: '#/definitions/userresponse.User'
    type: object
  receipt.shareResponse:
    properties:
      currency:
        type: string
      discrepancy:
        type: boolean
      items_total:
        type: string
      per_user:
        items:
          $ref: '#/definitions/receipt.userShareResponse'
        type: array
      service_charge:
        type: string
      tax:
        type: string
      total:
        type: string
      unassigned_items:
        items:
          type: string
        type: array
    type: object
  receipt.userShareResponse:
    properties:
      items_subtotal:
        type: string
      service_charge:
        type: string
      tax:
        type: string
      total:
        type: string
      user_id:
        type: string
    type: object
  response.Envelope:
    properties:
      code:
        type: string
      data: {}
      errors:
        items:
          $ref: '#/definitions/response.FieldError'
        type: array
      message:
        type: string
      meta: {}
      success:
        type: boolean
      timestamp:
        example: "2026-08-05T09:12:33.412Z"
        type: string
      trace_id:
        type: string
    type: object
  response.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
      rule:
        type: string
    type: object
  settlementrequest.Create:
    properties:
      amount:
        type: string
      currency:
        type: string
      from_user_id:
        type: string
      method:
        enum:
        - cash
        - bank_transfer
        type: string
      note:
        type: string
      proof_url:
        type: string
      to_user_id:
        type: string
    required:
    - amount
    - currency
    - from_user_id
    - method
    - to_user_id
    type: object
  settlementrequest.Reject:
    properties:
      reason:
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  settlementresponse.Settlement:
    properties:
      amount:
        type: string
      approved_at:
        type: string
      approved_by_user_id:
        type: string
      bank_account_holder:
        type: string
      bank_account_number:
        type: string
      bank_name:
        description: |-
          Bank details are the snapshot taken when the settlement was recorded, not a live read of the
          payee's participant record. The account number is always masked on the way out.
        type: string
      created_at:
        type: string
      currency:
        type: string
      from_user:
        $ref: '#/definitions/settlementresponse.User'
      from_user_id:
        type: string
      id:
        type: string
      method:
        type: string
      note:
        type: string
      proof_url:
        type: string
      rejected_reason:
        type: string
      status:
        type: string
      to_user:
        $ref: '#/definitions/settlementresponse.User'
      to_user_id:
        type: string
      trip_id:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  settlementresponse.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      has_account:
        type: boolean
      has_logged_in:
        type: boolean
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  triprequest.Create:
    properties:
      allow_settlement_before_end:
        type: boolean
      approval_required_expenses:
        type: boolean
      approval_required_settlements:
        type: boolean
      base_currency:
        type: string
      country:
        maxLength: 80
        type: string
      edit_permission:
        enum:
        - everyone
        - own_only
        type: string
      end_date:
        type: string
      multi_currency_enabled:
        type: boolean
      name:
        maxLength: 160
        type: string
      start_date:
        type: string
    required:
    - base_currency
    - edit_permission
    - end_date
    - name
    - start_date
    type: object
  triprequest.Update:
    properties:
      allow_settlement_before_end:
        type: boolean
      approval_required_expenses:
        type: boolean
      approval_required_settlements:
        type: boolean
      base_currency:
        type: string
      edit_permission:
        enum:
        - everyone
        - own_only
        type: string
      multi_currency_enabled:
        type: boolean
      name:
        maxLength: 160
        type: string
      version:
        minimum: 1
        type: integer
    required:
    - base_currency
    - edit_permission
    - name
    - version
    type: object
  tripresponse.Settings:
    properties:
      allow_settlement_before_end:
        type: boolean
      approval_required_expenses:
        type: boolean
      approval_required_settlements:
        type: boolean
      edit_permission:
        type: string
      multi_currency_enabled:
        type: boolean
    type: object
  tripresponse.Trip:
    properties:
      base_currency:
        type: string
      can_edit_settings:
        type: boolean
      code:
        type: string
      country:
        type: string
      currencies:
        description: |-
          Currencies is only populated on the trip list endpoint - every currency actually used on the
          trip, base currency first. Omitted (not just empty) elsewhere.
        items:
          type: string
        type: array
      end_date:
        type: string
      id:
        type: string
      is_finalized:
        type: boolean
      name:
        type: string
      planner_id:
        type: string
      settings:
        $ref: '#/definitions/tripresponse.Settings'
      start_date:
        type: string
      version:
        type: integer
    type: object
  userrequest.ChangePassword:
    properties:
      confirm_password:
        type: string
      current_password:
        maxLength: 128
        type: string
      new_password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - confirm_password
    - new_password
    type: object
  userrequest.Update:
    properties:
      avatar_url:
        maxLength: 2048
        type: string
      name:
        maxLength: 120
        type: string
    type: object
  userresponse.Lookup:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  userresponse.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      has_account:
        type: boolean
      has_logged_in:
        type: boolean
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Shared-trip expense settlement API.
  title: TripMate API
  version: "1.0"
paths:
  /auth/google:
    post:
      consumes:
      - application/json
      parameters:
      - description: Google ID token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/authrequest.Google'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/authresponse.Session'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Sign in with a verified Google ID token
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/authrequest.Login'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/authresponse.Session'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/authrequest.Refresh'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Revoke a refresh token
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/authrequest.Refresh'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/authresponse.Session'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Rotate a refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/authrequest.Register'
      produces:
      - application/json
      responses:
        "201":
