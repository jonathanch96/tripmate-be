basePath: /api/v1
definitions:
  authrequest.Login:
    properties:
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 128
        type: string
    required:
    - email
    - password
    type: object
  authrequest.Refresh:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  authrequest.Register:
    properties:
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 120
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  authresponse.Session:
    properties:
      access_token:
        type: string
      access_token_expires_at:
        type: string
      pending_invitations:
        items:
          $ref: '#/definitions/invitationresponse.Invitation'
        type: array
      refresh_token:
        type: string
      refresh_token_expires_at:
        type: string
      user:
        $ref: '#/definitions/userresponse.User'
    type: object
  expenserequest.Create:
    properties:
      amount:
        type: string
      currency:
        type: string
      description:
        maxLength: 255
        type: string
      expense_date:
        type: string
      note:
        type: string
      participants:
        items:
          type: string
        type: array
      payers:
        items:
          $ref: '#/definitions/expenserequest.Payer'
        minItems: 1
        type: array
      split_type:
        enum:
        - equal
        - manual
        - item
        type: string
      splits:
        items:
          $ref: '#/definitions/expenserequest.Split'
        type: array
    required:
    - amount
    - currency
    - description
    - expense_date
    - payers
    - split_type
    type: object
  expenserequest.Payer:
    properties:
      amount:
        type: string
      user_id:
        type: string
    required:
    - amount
    - user_id
    type: object
  expenserequest.Reject:
    properties:
      reason:
        maxLength: 500
        type: string
    required:
    - reason
    type: object
  expenserequest.Split:
    properties:
      amount:
        type: string
      user_id:
        type: string
    required:
    - amount
    - user_id
    type: object
  expenserequest.Update:
    properties:
      amount:
        type: string
      currency:
        type: string
      description:
        type: string
      expense_date:
        type: string
      note:
        type: string
      participants:
        items:
          type: string
        type: array
      payers:
        items:
          $ref: '#/definitions/expenserequest.Payer'
        type: array
      split_type:
        type: string
      splits:
        items:
          $ref: '#/definitions/expenserequest.Split'
        type: array
      version:
        minimum: 1
        type: integer
    required:
    - version
    type: object
  expenseresponse.Expense:
    properties:
      amount:
        type: string
      approved_at:
        type: string
      approved_by:
        $ref: '#/definitions/expenseresponse.User'
      can_approve:
        type: boolean
      can_delete:
        type: boolean
      can_edit:
        type: boolean
      can_reject:
        type: boolean
      created_at:
        type: string
      created_by:
        $ref: '#/definitions/expenseresponse.User'
      currency:
        type: string
      description:
        type: string
      expense_date:
        type: string
      id:
        type: string
      note:
        type: string
      payers:
        items:
          $ref: '#/definitions/expenseresponse.Payer'
        type: array
      rejected_reason:
        type: string
      source:
        type: string
      split_type:
        type: string
      splits:
        items:
          $ref: '#/definitions/expenseresponse.Split'
        type: array
      status:
        type: string
      trip_id:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  expenseresponse.Payer:
    properties:
      amount:
        type: string
      user:
        $ref: '#/definitions/expenseresponse.User'
      user_id:
        type: string
    type: object
  expenseresponse.Split:
    properties:
      amount:
        type: string
      user:
        $ref: '#/definitions/expenseresponse.User'
      user_id:
        type: string
    type: object
  expenseresponse.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  finance.rateRequest:
    properties:
      from:
        type: string
      rate:
        type: string
      to:
        type: string
    type: object
  finance.settlementRequest:
    properties:
      amount:
        type: string
      currency:
        type: string
      from_user_id:
        type: string
      method:
        type: string
      note:
        type: string
      proof_url:
        type: string
      to_user_id:
        type: string
    type: object
  invitationrequest.Create:
    properties:
      email:
        maxLength: 255
        type: string
    required:
    - email
    type: object
  invitationresponse.Invitation:
    properties:
      email:
        type: string
      expires_at:
        type: string
      id:
        type: string
      status:
        type: string
      token:
        type: string
      trip_id:
        type: string
    type: object
  invitationresponse.InviteResult:
    properties:
      invitation:
        $ref: '#/definitions/invitationresponse.Invitation'
      invite_link:
        type: string
      participant:
        $ref: '#/definitions/participantresponse.Participant'
      status:
        type: string
    type: object
  participantrequest.Add:
    properties:
      user_id:
        type: string
    required:
    - user_id
    type: object
  participantrequest.BankInfo:
    properties:
      account_holder:
        maxLength: 160
        type: string
      account_number:
        maxLength: 120
        type: string
      bank_name:
        maxLength: 120
        type: string
    required:
    - account_holder
    - account_number
    - bank_name
    type: object
  participantrequest.Update:
    properties:
      bank_info:
        $ref: '#/definitions/participantrequest.BankInfo'
      role:
        enum:
        - planner
        - participant
        type: string
    type: object
  participantresponse.BankInfo:
    properties:
      account_holder:
        type: string
      account_number:
        type: string
      bank_name:
        type: string
    type: object
  participantresponse.Participant:
    properties:
      bank_info:
        $ref: '#/definitions/participantresponse.BankInfo'
      id:
        type: string
      joined_at:
        type: string
      role:
        type: string
      trip_id:
        type: string
      user:
        $ref: '#/definitions/participantresponse.User'
      user_id:
        type: string
    type: object
  participantresponse.User:
    properties:
      avatar_url:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  response.Envelope:
    properties:
      code:
        type: string
      data: {}
      errors:
        items:
          $ref: '#/definitions/response.FieldError'
        type: array
      message:
        type: string
      meta: {}
      success:
        type: boolean
      timestamp:
        example: "2026-08-05T09:12:33.412Z"
        type: string
      trace_id:
        type: string
    type: object
  response.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
      rule:
        type: string
    type: object
  triprequest.Create:
    properties:
      allow_settlement_before_end:
        type: boolean
      approval_required_expenses:
        type: boolean
      approval_required_settlements:
        type: boolean
      base_currency:
        type: string
      edit_permission:
        enum:
        - everyone
        - own_only
        type: string
      end_date:
        type: string
      multi_currency_enabled:
        type: boolean
      name:
        maxLength: 160
        type: string
      start_date:
        type: string
    required:
    - base_currency
    - edit_permission
    - end_date
    - name
    - start_date
    type: object
  triprequest.Update:
    properties:
      allow_settlement_before_end:
        type: boolean
      approval_required_expenses:
        type: boolean
      approval_required_settlements:
        type: boolean
      base_currency:
        type: string
      edit_permission:
        enum:
        - everyone
        - own_only
        type: string
      multi_currency_enabled:
        type: boolean
      name:
        maxLength: 160
        type: string
      version:
        minimum: 1
        type: integer
    required:
    - base_currency
    - edit_permission
    - name
    - version
    type: object
  tripresponse.Settings:
    properties:
      allow_settlement_before_end:
        type: boolean
      approval_required_expenses:
        type: boolean
      approval_required_settlements:
        type: boolean
      edit_permission:
        type: string
      multi_currency_enabled:
        type: boolean
    type: object
  tripresponse.Trip:
    properties:
      base_currency:
        type: string
      can_edit_settings:
        type: boolean
      code:
        type: string
      end_date:
        type: string
      id:
        type: string
      is_finalized:
        type: boolean
      name:
        type: string
      planner_id:
        type: string
      settings:
        $ref: '#/definitions/tripresponse.Settings'
      start_date:
        type: string
      version:
        type: integer
    type: object
  userrequest.Update:
    properties:
      avatar_url:
        maxLength: 2048
        type: string
      name:
        maxLength: 120
        type: string
    type: object
  userresponse.Lookup:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  userresponse.User:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Shared-trip expense settlement API.
  title: TripMate API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/authrequest.Login'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/authresponse.Session'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/authrequest.Refresh'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Revoke a refresh token
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/authrequest.Refresh'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/authresponse.Session'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Rotate a refresh token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/authrequest.Register'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/authresponse.Session'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Register a new account
      tags:
      - auth
  /exchange-rates:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List global exchange rates
      tags:
      - finance
  /invitations/{token}/accept:
    post:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/participantresponse.Participant'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Accept an invitation
      tags:
      - invitations
  /invitations/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List my pending invitations
      tags:
      - invitations
  /ping:
    get:
      description: Returns a fully populated envelope proving the API composition
        root is wired.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Envelope'
      summary: Check API connectivity
      tags:
      - system
  /trips:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List my trips
      tags:
      - trips
    post:
      parameters:
      - description: Trip
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/triprequest.Create'
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/tripresponse.Trip'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create a trip
      tags:
      - trips
  /trips/{code}:
    get:
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/tripresponse.Trip'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get a trip
      tags:
      - trips
    patch:
      parameters:
      - description: Trip settings
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/triprequest.Update'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/tripresponse.Trip'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update trip settings
      tags:
      - trips
  /trips/{code}/balances:
    get:
      parameters:
      - description: Trip code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Calculate trip balances
      tags:
      - finance
  /trips/{code}/exchange-rates:
    get:
      parameters:
      - description: Trip code
        in: path
        name: code
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List effective trip exchange rates
      tags:
      - finance
    put:
      consumes:
      - application/json
      parameters:
      - description: Trip code
        in: path
        name: code
        required: true
        type: string
      - description: Rate
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/finance.rateRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Set a locked trip exchange rate
      tags:
      - finance
  /trips/{code}/expenses:
    get:
      parameters:
      - description: Trip code
        in: path
        name: code
        required: true
        type: string
      - description: pending, approved, or rejected
        in: query
        name: status
        type: string
      - description: ISO currency
        in: query
        name: currency
        type: string
      - description: Payer user ID
        in: query
        name: payer_user_id
        type: string
      - description: Split participant user ID
        in: query
        name: split_user_id
        type: string
      - description: Start date (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: End date (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: Description search
        in: query
        name: q
        type: string
      - description: date_desc, amount_desc, or created_desc
        in: query
        name: sort
        type: string
      - description: Page
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/expenseresponse.Expense'
                  type: array
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: List trip expenses
      tags:
      - expenses
    post:
      parameters:
      - description: Trip code
        in: path
        name: code
        required: true
        type: string
      - description: Expense
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/expenserequest.Create'
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/expenseresponse.Expense'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Create an expense
      tags:
      - expenses
  /trips/{code}/expenses/{id}:
    delete:
      parameters:
      - description: Trip code
        in: path
        name: code
        required: true
        type: string
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Delete an expense
      tags:
      - expenses
    get:
      parameters:
      - description: Trip code
        in: path
        name: code
        required: true
        type: string
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/expenseresponse.Expense'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Get an expense
      tags:
      - expenses
    patch:
      parameters:
      - description: Trip code
        in: path
        name: code
        required: true
        type: string
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      - description: Expense changes
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/expenserequest.Update'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/expenseresponse.Expense'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Update an expense
      tags:
      - expenses
  /trips/{code}/expenses/{id}/approve:
    post:
      parameters:
      - description: Trip code
        in: path
        name: code
        required: true
        type: string
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/expenseresponse.Expense'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Approve a pending expense
      tags:
      - expenses
  /trips/{code}/expenses/{id}/reject:
    post:
      parameters:
      - description: Trip code
        in: path
        name: code
        required: true
        type: string
      - description: Expense ID
        in: path
        name: id
        required: true
        type: string
      - description: Rejection reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/expenserequest.Reject'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/expenseresponse.Expense'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
