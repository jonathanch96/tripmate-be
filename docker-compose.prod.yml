x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-production}
  APP_PORT: 8080
  DB_HOST: tripmate-postgres
  DB_PORT: 5432
  DB_USER: ${DB_USER:-tripmate}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in jblabs-tripmate-be/.env}
  DB_NAME: ${DB_NAME:-tripmate}
  DB_SCHEMA: ${DB_SCHEMA:-tripmate}
  DB_SSLMODE: ${DB_SSLMODE:-prefer}
  DB_AUTO_MIGRATE: "false"
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in jblabs-tripmate-be/.env}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in jblabs-tripmate-be/.env}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  STORAGE_LOCAL_ROOT: /data/receipts
  STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:8080/api/v1/receipt-images}

services:
  migrate:
    image: ${BACKEND_IMAGE:-tripmate-backend:local}
    build:
      context: .
      dockerfile: Dockerfile.prod
    entrypoint: ["/tripmate-migrate"]
    environment: *backend-environment
    networks:
      - shared_network
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${BACKEND_IMAGE:-tripmate-backend:local}
    build:
      context: .
      dockerfile: Dockerfile.prod
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    volumes:
      - receipts-data:/data/receipts
    networks:
      shared_network:
        aliases:
          - tripmate-backend
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  shared_network:
    external: true
    name: shared_network

volumes:
  receipts-data:
